---
- name: Install prerequisite packages
  dnf:
    name:
      - dnf-plugins-core
      - python3-PyMySQL
    state: present

- name: Disable the built-in MySQL module
  command: dnf module disable mysql -y
  changed_when: false
  ignore_errors: true
  when: ansible_distribution_major_version == "8"

- name: Download MySQL repository RPM
  get_url:
    headers:
      user-agent: curl/7.81.0
    url: "{{ mysql_yum_repo_rpm_url }}"
    dest: /tmp/mysql84-community-release-el9-4.noarch.rpm
    mode: '0644'



- name: Install MySQL repository RPM from local file
  dnf:
    name: /tmp/mysql84-community-release-el9-4.noarch.rpm
    state: present
    disable_gpg_check: true
- name: Disable the MySQL 8.4 repository
  command: dnf config-manager --disable mysql-8.4-lts-community


- name: Enable the MySQL 8.0 repository
  command: dnf config-manager --enable mysql80-community


- name: Install MySQL server
  dnf:
    name:
      - mysql-community-server
    state: present

